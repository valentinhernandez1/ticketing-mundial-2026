services:

  postgres:
    image: postgres:16-alpine
    container_name: ticketing_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ticketing
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./sql/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./sql/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./sql/04_queries.sql:/docker-entrypoint-initdb.d/04_queries.sql:ro
      - ./sql/05_seed.sql:/docker-entrypoint-initdb.d/05_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL:      jdbc:postgresql://postgres:5432/ticketing
      DB_USER:     postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET:  ${JWT_SECRET:-c2VjcmV0by1tdXktbGFyZ28tcGFyYS1obWFjLXNoYTI1Ni1kZW1v}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
